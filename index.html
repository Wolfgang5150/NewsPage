<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="240">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBAL DIGITAL NETWORK</title>
  <style>
    :root {
      --bg: #020602;
      --bg-deep: #010301;
      --green: #37ff63;
      --green-soft: rgba(55,255,99,.36);
      --green-mid: rgba(55,255,99,.82);
      --green-strong: rgba(55,255,99,1);
      --green-dim: #0e4d18;
      --panel: rgba(0, 18, 0, 0.30);
      --line: rgba(90, 255, 135, 0.10);
    }

    * { box-sizing: border-box; font-family: inherit; }
    html, body { min-height: 100%; }

    @font-face {
      font-family: "PrintChar21";
      src: url("./PrintChar21.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding: 16px 16px 72px;
      color: var(--green);
      font-family: "PrintChar21", "Courier New", Courier, monospace;
      text-transform: uppercase;
      background:
        radial-gradient(circle at 50% 45%, rgba(32,100,40,.16) 0%, rgba(8,28,10,.07) 28%, rgba(1,6,1,0) 58%),
        radial-gradient(circle at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.32) 92%),
        linear-gradient(to bottom, #031003 0%, var(--bg) 48%, var(--bg-deep) 100%);
      text-shadow:
        0 0 3px rgba(55,255,99,1),
        0 0 12px rgba(55,255,99,.95),
        0 0 26px rgba(55,255,99,.60),
        0 0 42px rgba(55,255,99,.30);
      overflow-x: hidden;
      position: relative;
      animation: crt-flicker 9s infinite steps(1);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(110,255,150,.11) 0px,
          rgba(110,255,150,.11) 1px,
          rgba(0,0,0,.24) 1px,
          rgba(0,0,0,.24) 3px,
          rgba(14,55,18,.14) 3px,
          rgba(14,55,18,.14) 5px,
          transparent 5px,
          transparent 7px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025) 0px,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 2px
        ),
        linear-gradient(to right, rgba(0,0,0,.14), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.14));
      mix-blend-mode: screen;
      opacity: 1;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(0,0,0,0) 56%, rgba(0,0,0,.18) 78%, rgba(0,0,0,.45) 100%),
        linear-gradient(to bottom, rgba(85,255,130,.05), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.16));
      mix-blend-mode: multiply;
    }

    .screen-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .04;
      z-index: 1;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.5) .35px, transparent .75px),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,.38) .35px, transparent .75px),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,.44) .35px, transparent .75px);
      background-size: 13px 13px, 17px 17px, 19px 19px;
      animation: noise-jitter .25s infinite steps(2);
    }

    .page {
      position: relative;
      z-index: 2;
    }

    .frame {
      border: 2px solid var(--green);
      background: linear-gradient(to bottom, rgba(0,18,0,.22), rgba(0,12,0,.34));
      box-shadow:
        inset 0 0 34px rgba(55,255,99,.24),
        0 0 20px rgba(55,255,99,.42),
        0 0 40px rgba(55,255,99,.20);
      padding: 14px 22px 12px;
      margin-bottom: 26px;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(80,255,130,.12) 0 1px, rgba(0,0,0,.12) 1px 3px, rgba(16,60,20,.12) 3px 5px, transparent 5px 7px);
      opacity: .78;
    }

    .hero {
      max-width: 1320px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .hero-rule {
      height: 2px;
      width: min(92%, 880px);
      margin: 8px auto 10px;
      background: linear-gradient(to right, transparent, var(--green), transparent);
      box-shadow: 0 0 18px rgba(55,255,99,.72), 0 0 30px rgba(55,255,99,.24);
    }

    .ascii-title {
      display: inline-block;
      margin: 0 auto;
      padding: 6px 18px 7px;
      text-align: center;
      font-size: 35px;
      line-height: 1;
      letter-spacing: .085em;
      white-space: pre;
      color: rgba(55,255,99,.98);
      text-shadow:
        0 0 2px rgba(55,255,99,.95),
        0 0 10px rgba(55,255,99,.72),
        0 0 22px rgba(55,255,99,.34);
      filter: none;
      position: relative;
      border: 2px solid rgba(55,255,99,.88);
      background:
        repeating-linear-gradient(to bottom, rgba(110,255,150,.10) 0 1px, rgba(0,0,0,.12) 1px 3px, transparent 3px 6px),
        rgba(0, 24, 0, 0.24);
      box-shadow:
        inset 0 0 18px rgba(55,255,99,.16),
        0 0 20px rgba(55,255,99,.46),
        0 0 34px rgba(55,255,99,.24);
    }

    .ascii-title::before {
      content: none;
    }

    .corp-tag {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 18px;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      font-weight: 700;
      letter-spacing: .04em;
      font-size: 12px;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
    }

    .status, .category, .feed-item {
      max-width: 1600px;
      position: relative;
      z-index: 2;
    }

    .status-line, .meta-line {
      margin: 8px 0;
      font-size: 12px;
      line-height: 1.22;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 14px rgba(55,255,99,.74),
        0 0 28px rgba(55,255,99,.30);
      text-align: right;
    }

    .meta-line { opacity: .95; }

    .startup-line, .startup-meta {
      opacity: .40;
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
    }

    .startup-meta { opacity: .34; }

    .slow-blink {
      animation: slow-blink 2.8s ease-in-out infinite;
    }

    .category {
      display: inline-block;
      margin-top: 30px;
      margin-bottom: 10px;
      border: 1px solid var(--green);
      padding: 5px 10px;
      background: rgba(0,40,0,.35);
      font-size: 12px;
      box-shadow: inset 0 0 10px rgba(55,255,99,.10), 0 0 12px rgba(55,255,99,.18);
    }

    .feed-item {
      margin: 14px 0;
      padding-left: 10px;
      border-left: 2px solid var(--green);
      font-size: 11px;
      line-height: 1.3;
      word-break: break-word;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 16px rgba(55,255,99,.68),
        0 0 30px rgba(55,255,99,.28);
    }

    .feed-item a {
      color: inherit;
      text-decoration: none;
    }

    .feed-item a:hover { text-decoration: underline; }

    .headline-time {
      display: inline;
      margin-left: 10px;
      font-size: 8px;
      line-height: 1.18;
      opacity: .40;
      color: var(--green);
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
      white-space: nowrap;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.15em;
      background: var(--green);
      vertical-align: bottom;
      animation: blink .85s steps(1) infinite;
      box-shadow: 0 0 14px rgba(55,255,99,.62);
      position: relative;
      z-index: 2;
    }

    #sync-timer {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      z-index: 5;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
    }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes noise-jitter {
      0% { transform: translate(0,0); }
      25% { transform: translate(.3px,-.4px); }
      50% { transform: translate(-.2px,.2px); }
      75% { transform: translate(.4px,.1px); }
      100% { transform: translate(0,0); }
    }

    @keyframes crt-flicker {
      0%, 19%, 21%, 63%, 65%, 100% { opacity: 1; }
      20% { opacity: .992; }
      64% { opacity: .996; }
    }

    @keyframes corp-marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes slow-blink {
      0%, 100% { opacity: .42; }
      50% { opacity: .16; }
    }

    @media (max-width: 700px) {
      body { padding-inline: 10px; }
      .frame { padding-inline: 10px; min-height: 250px; }
      .corp-tag { font-size: 12px; padding-inline: 10px; }
      .ascii-title { font-size: 15px; letter-spacing: .05em; padding-inline: 10px; }
      .status-line, .meta-line, .category, .feed-item, #sync-timer { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="screen-noise" aria-hidden="true"></div>
  <div class="page">
    <div id="sync-timer">NEXT_SYNC: 04:00</div>

    <section class="frame">
      <div class="hero">
        <div class="hero-rule"></div>
<pre class="ascii-title" data-glow=">>> [ GLOBAL DIGITAL NETWORK ] <<<">>>> [ GLOBAL DIGITAL NETWORK ] <<<</pre>
        <div class="hero-rule"></div>
        <div class="corp-tag" id="corp-tag">
            <div class="corp-tag-static" id="corp-tag-static">============ A WEYLAND-YUTANI COMPANY ============</div>
            <div class="corp-tag-marquee" id="corp-tag-marquee" aria-hidden="false">
              <div class="corp-tag-track" id="corp-tag-track"></div>
            </div>
          </div>
      </div>
    </section>

    <main id="output" class="status"></main>
    <span class="cursor" aria-hidden="true"></span>
  </div>

  <script>
    (() => {
      const REFRESH_SECONDS = 240;
      const FEED_JSON_URL = './feeds.json';
      const MAX_ITEMS = 5;
      const TYPE_DELAY = 20;
      const LINE_DELAY = 185;
      const STARTUP_LINE_DELAY = 650;
      const timerEl = document.getElementById('sync-timer');
      const output = document.getElementById('output');
      let timeLeft = REFRESH_SECONDS;

      function normalizeCorpBar(data) {
        if (!data || typeof data !== 'object') return null;
        return {
          as_of: data.as_of || '',
          tickers: Array.isArray(data.tickers) ? data.tickers : [],
          us_holiday: data.us_holiday && typeof data.us_holiday === 'object' ? data.us_holiday : null,
          world_observance: data.world_observance && typeof data.world_observance === 'object' ? data.world_observance : null
        };
      }

      function esc(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatCorpTimestamp(value) {
        if (!value) return '';
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return String(value);
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const yy = String(d.getFullYear()).slice(-2);
          const hh = String(((d.getHours() + 11) % 12) + 1);
          const min = String(d.getMinutes()).padStart(2, '0');
          const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
          return `${mm}/${dd}/${yy} ${hh}:${min} ${ampm}`;
        } catch (e) {
          return String(value);
        }
      }

      function formatHeadlineTimestamp(value) {
        if (!value) return '';
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return '';
          const yyyy = d.getUTCFullYear();
          const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(d.getUTCDate()).padStart(2, '0');
          const hh = String(d.getUTCHours()).padStart(2, '0');
          const min = String(d.getUTCMinutes()).padStart(2, '0');
          return ` [${yyyy}-${mm}-${dd} ${hh}:${min} UTC]`;
        } catch (e) {
          return '';
        }
      }

      function formatTickerItem(ticker) {
        const symbol = ticker.symbol || 'UNKNOWN';
        const price = (ticker.price !== undefined && ticker.price !== null && ticker.price !== '') ? String(ticker.price) : 'N/A';
        const change = ticker.change_percent ? ` ${ticker.change_percent}` : '';
        const stamp = ticker.as_of ? ` ${formatCorpTimestamp(ticker.as_of)}` : '';
        const href = ticker.link || '#';
        const source = ticker.source ? ` ${ticker.source}` : '';
        return `<a class="corp-tag-item" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="corp-tag-value">${esc(symbol)} ${esc(price)}${esc(change)}</span><span class="corp-tag-meta">${esc(stamp + source)}</span></a>`;
      }

      function formatHolidayItem(label, payload, fallbackPayload) {
        const item = payload || fallbackPayload;
        const href = item.link || '#';
        const region = item.region ? ` ${item.region}` : '';
        const stamp = item.date ? ` ${formatCorpTimestamp(item.date + 'T12:00:00')}` : '';
        const source = item.source ? ` ${item.source}` : '';
        return `<a class="corp-tag-item" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="corp-tag-label">${esc(label)}</span><span class="corp-tag-value">${esc(item.name)}${esc(region)}</span><span class="corp-tag-meta">${esc(stamp + source)}</span></a>`;
      }

      function buildCorpTickerItems(data) {
        const tickers = (data && data.tickers && data.tickers.length) ? data.tickers : DEFAULT_TICKERS;
        const tickerItems = tickers.map(formatTickerItem);
        const usHolidayItem = formatHolidayItem('US HOLIDAY', data && data.us_holiday, DEFAULT_US_HOLIDAY);
        const worldObservanceItem = formatHolidayItem('WORLD OBSERVANCE', data && data.world_observance, DEFAULT_WORLD_OBSERVANCE);
        return [...tickerItems, usHolidayItem, worldObservanceItem];
      }

      async function loadCorpBarData() {
        try {
          const response = await fetch(CORP_BAR_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return normalizeCorpBar(await response.json());
        } catch (err) {
          return null;
        }
      }

      async function initCorpTicker() {
        if (!corpTag || !corpTagTrack) return;
        const data = await loadCorpBarData();
        const items = buildCorpTickerItems(data);
        const segmentHtml = items.map((item) => `${item}<span class="corp-tag-sep">///</span>`).join('');
        corpTagTrack.innerHTML =
          `<span class="corp-tag-segment">${segmentHtml}</span>` +
          `<span class="corp-tag-segment">${segmentHtml}</span>`;
        corpTag.classList.remove('scrolling');
        setTimeout(() => corpTag.classList.add('scrolling'), 5000);
      }

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `NEXT_SYNC: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function autoScroll() {
        window.scrollTo({
          top: document.documentElement.scrollHeight || document.body.scrollHeight,
          behavior: 'smooth'
        });
      }

      async function typeText(el, text, delay = TYPE_DELAY) {
        el.textContent = '';
        for (const ch of text) {
          el.textContent += ch;
          await sleep(delay);
        }
      }

      async function typeLine(text, className = 'status-line') {
        const el = document.createElement('div');
        el.className = className;
        output.appendChild(el);
        autoScroll();
        await typeText(el, text);
        autoScroll();
        await sleep(LINE_DELAY);
        return el;
      }

      async function revealLine(text, className = 'startup-line', delay = STARTUP_LINE_DELAY) {
        const el = document.createElement('div');
        el.className = className;
        output.appendChild(el);
        autoScroll();
        el.textContent = text;
        autoScroll();
        await sleep(delay);
        return el;
      }

      async function typeCategory(text) {
        const el = document.createElement('div');
        el.className = 'category';
        output.appendChild(el);
        autoScroll();
        await typeText(el, text);
        autoScroll();
        await sleep(LINE_DELAY);
        return el;
      }

      async function typeFeedItem(item) {
        const row = document.createElement('div');
        row.className = 'feed-item';
        const a = document.createElement('a');
        a.href = item.link || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        row.appendChild(a);
        feedOutput.appendChild(row);
        autoScrollFeeds();
        await typeText(a, '+ ' + (item.title || 'UNTITLED REPORT'));

        const stamp = formatHeadlineTimestamp(item.published_at);
        if (stamp) {
          const time = document.createElement('span');
          time.className = 'headline-time';
          time.textContent = stamp;
          row.appendChild(time);
        }

        autoScrollFeeds();
        await sleep(118);
        return row;
      }

      function normalize(data) {
        if (!data || !Array.isArray(data.categories)) {
          throw new Error('INVALID_FEEDS_JSON');
        }
        return data;
      }

      async function render(data) {
        output.innerHTML = '';
        await revealLine('...INITIALIZING PROTOCOL 5150/1984', 'status-line startup-line');
        await revealLine('...ESTABLISHING SECURE COMM-LINK', 'status-line startup-line');
        await revealLine('...UPLINK TARGET: ICE STATION ZEBRA', 'status-line startup-line');
        const statusLine = await revealLine('...STATUS: ONLINE', 'status-line startup-line');
        statusLine.classList.add('slow-blink');
        if (data.generated_at) {
          await revealLine('...LAST_SYNC: ' + data.generated_at.replace('T', ' ').replace('Z', ' UTC'), 'meta-line startup-meta');
        }
        for (const section of data.categories) {
          await typeCategory(`[SEC: ${section.name}]`);
          const items = Array.isArray(section.items) ? section.items.slice(0, MAX_ITEMS) : [];
          if (!items.length) {
            await typeLine('> [NO_TRANSMISSIONS_RECEIVED]', 'feed-item');
            continue;
          }
          for (const item of items) {
            await typeFeedItem(item);
          }
        }
        const monitorLine = await revealLine('[SYSTEM STATUS: MONITORING ACTIVE]', 'meta-line startup-meta');
        monitorLine.classList.add('slow-blink');
      }

      async function fail(err) {
        output.innerHTML = '';
        await revealLine('...INITIALIZING PROTOCOL 5150/1984', 'status-line startup-line');
        await revealLine('...ESTABLISHING SECURE COMM-LINK', 'status-line startup-line');
        await revealLine('...UPLINK TARGET: ICE STATION ZEBRA', 'status-line startup-line');
        await revealLine('...STATUS: SIGNAL LOSS', 'status-line startup-line');
        await revealLine('...ERROR: ' + String(err && err.message ? err.message : err), 'meta-line startup-meta');
      }

      async function loadFeeds() {
        const response = await fetch(FEED_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = normalize(await response.json());
        await render(data);
      }

      updateTimer();
      setInterval(() => {
        timeLeft -= 1;
        if (timeLeft < 0) {
          window.location.reload();
          return;
        }
        updateTimer();
      }, 1000);

      initCorpTicker();
      loadFeeds().catch(fail);
    })();
  </script>
</body>
</html>
