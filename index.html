<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="240">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBAL DIGITAL NETWORK</title>
  <style>
    :root {
      --bg: #020602;
      --bg-deep: #010301;
      --green: #37ff63;
      --green-soft: rgba(55,255,99,.36);
      --green-mid: rgba(55,255,99,.82);
      --green-strong: rgba(55,255,99,1);
      --green-dim: #0e4d18;
      --panel: rgba(0, 18, 0, 0.30);
      --line: rgba(90, 255, 135, 0.10);
    }

    * { box-sizing: border-box; font-family: inherit; }
    html, body { height: 100%; }

    @font-face {
      font-family: "PrintChar21";
      src: url("./PrintChar21.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding: 16px;
      color: var(--green);
      font-family: "PrintChar21", "Courier New", Courier, monospace;
      text-transform: uppercase;
      background:
        radial-gradient(circle at 50% 45%, rgba(32,100,40,.16) 0%, rgba(8,28,10,.07) 28%, rgba(1,6,1,0) 58%),
        radial-gradient(circle at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.32) 92%),
        linear-gradient(to bottom, #031003 0%, var(--bg) 48%, var(--bg-deep) 100%);
      text-shadow:
        0 0 3px rgba(55,255,99,1),
        0 0 12px rgba(55,255,99,.95),
        0 0 26px rgba(55,255,99,.60),
        0 0 42px rgba(55,255,99,.30);
      overflow: hidden;
      position: relative;
      animation: crt-flicker 9s infinite steps(1);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(110,255,150,.11) 0px,
          rgba(110,255,150,.11) 1px,
          rgba(0,0,0,.24) 1px,
          rgba(0,0,0,.24) 3px,
          rgba(14,55,18,.14) 3px,
          rgba(14,55,18,.14) 5px,
          transparent 5px,
          transparent 7px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025) 0px,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 2px
        ),
        linear-gradient(to right, rgba(0,0,0,.14), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.14));
      mix-blend-mode: screen;
      opacity: 1;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(0,0,0,0) 56%, rgba(0,0,0,.18) 78%, rgba(0,0,0,.45) 100%),
        linear-gradient(to bottom, rgba(85,255,130,.05), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.16));
      mix-blend-mode: multiply;
    }

    .screen-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .04;
      z-index: 1;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.5) .35px, transparent .75px),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,.38) .35px, transparent .75px),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,.44) .35px, transparent .75px);
      background-size: 13px 13px, 17px 17px, 19px 19px;
      animation: noise-jitter .25s infinite steps(2);
    }

    .page {
      position: relative;
      z-index: 2;
      height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .frame {
      border: 2px solid var(--green);
      background: linear-gradient(to bottom, rgba(0,18,0,.22), rgba(0,12,0,.34));
      box-shadow:
        inset 0 0 34px rgba(55,255,99,.24),
        0 0 20px rgba(55,255,99,.42),
        0 0 40px rgba(55,255,99,.20);
      padding: 10px 14px 9px;
      min-height: 0;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(80,255,130,.12) 0 1px, rgba(0,0,0,.12) 1px 3px, rgba(16,60,20,.12) 3px 5px, transparent 5px 7px);
      opacity: .78;
    }

    .hero {
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 2px 0 0;
      text-align: center;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hero-rule { display: none; }

    .ascii-title {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      text-align: center;
      font-size: clamp(18px, 3.25vw, 35px);
      line-height: 1.02;
      letter-spacing: .045em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      color: rgba(55,255,99,.98);
      text-shadow:
        0 0 4px rgba(55,255,99,.98),
        0 0 14px rgba(55,255,99,.78),
        0 0 28px rgba(55,255,99,.32);
      filter: none;
      position: relative;
      border: none;
      background: none;
      box-shadow: none;
    }

    .ascii-title::before { content: none; }

    .corp-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 30px;
      margin-top: 0;
      padding: 5px 10px 4px;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      font-weight: 700;
      letter-spacing: .04em;
      font-size: clamp(9px, 1.15vw, 12px);
      line-height: 1.05;
      text-align: center;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .top-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .status {
      max-width: 1600px;
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
    }

    .status-line, .meta-line {
      margin: 6px 0;
      font-size: 8px;
      line-height: 1.18;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 14px rgba(55,255,99,.74),
        0 0 28px rgba(55,255,99,.30);
      text-align: right;
    }

    .meta-line { opacity: .95; }

    .startup-line, .startup-meta {
      opacity: .40;
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
    }

    .startup-meta { opacity: .34; }

    .feed-shell {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(55,255,99,.18);
      padding-top: 10px;
      padding-bottom: 0;
    }

    .bottom-panel {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 16px;
      min-height: 214px;
      border-top: 1px solid rgba(55,255,99,.18);
      padding-top: 12px;
      margin-top: 2px;
      position: relative;
      z-index: 2;
    }

    .bottom-left {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .bottom-right {
      display: flex;
      align-items: flex-end;
      flex: 0 0 auto;
    }

    .feed-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(55,255,99,.5) rgba(0,0,0,.18);
    }

    .feed-scroll::-webkit-scrollbar {
      width: 10px;
    }

    .feed-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,.18);
    }

    .feed-scroll::-webkit-scrollbar-thumb {
      background: rgba(55,255,99,.45);
      box-shadow: 0 0 10px rgba(55,255,99,.25);
    }

    .category {
      display: inline-block;
      margin-top: 30px;
      margin-bottom: 10px;
      border: 1px solid var(--green);
      padding: 5px 10px;
      background: rgba(0,40,0,.35);
      font-size: 12px;
      box-shadow: inset 0 0 10px rgba(55,255,99,.10), 0 0 12px rgba(55,255,99,.18);
    }

    .feed-item {
      margin: 14px 0;
      padding-left: 10px;
      border-left: 2px solid var(--green);
      font-size: 11px;
      line-height: 1.3;
      word-break: break-word;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 16px rgba(55,255,99,.68),
        0 0 30px rgba(55,255,99,.28);
    }

    .feed-item a {
      color: inherit;
      text-decoration: none;
    }

    .feed-item a:hover { text-decoration: underline; }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.15em;
      background: var(--green);
      vertical-align: bottom;
      animation: blink .85s steps(1) infinite;
      box-shadow: 0 0 14px rgba(55,255,99,.62);
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 5;
    }

    #sync-timer {
      position: relative;
      right: auto;
      bottom: auto;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      z-index: 5;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
      align-self: flex-end;
    }


    .qr-callout {
      position: relative;
      left: auto;
      bottom: auto;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      max-width: min(52vw, 760px);
      pointer-events: none;
      flex: 1 1 auto;
    }

    .qr-callout img {
      width: 192px;
      height: 192px;
      display: block;
      image-rendering: pixelated;
      box-shadow:
        0 0 14px rgba(55,255,99,.26),
        0 0 30px rgba(55,255,99,.14);
      flex: 0 0 auto;
    }

    .qr-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 192px;
      padding-bottom: 2px;
      line-height: 1.08;
      text-align: left;
      color: var(--green);
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 12px rgba(55,255,99,.72),
        0 0 24px rgba(55,255,99,.26);
    }

    .qr-copy .line-1 {
      font-size: 12px;
      margin-bottom: 8px;
    }

    .qr-copy .line-2 {
      font-size: 15px;
    }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes noise-jitter {
      0% { transform: translate(0,0); }
      25% { transform: translate(.3px,-.4px); }
      50% { transform: translate(-.2px,.2px); }
      75% { transform: translate(.4px,.1px); }
      100% { transform: translate(0,0); }
    }

    @keyframes crt-flicker {
      0%, 19%, 21%, 63%, 65%, 100% { opacity: 1; }
      20% { opacity: .992; }
      64% { opacity: .996; }
    }

    @media (max-width: 700px) {
      body { padding-inline: 10px; }
      .page { height: calc(100vh - 20px); }
      .frame { padding: 8px 10px 7px; min-height: 0; }
      .hero { gap: 6px; }
      .corp-tag {
        min-height: 24px;
        font-size: clamp(7px, 2.2vw, 11px);
        padding-inline: 6px;
      }
      .ascii-title {
        font-size: clamp(12px, 4.8vw, 22px);
        letter-spacing: .03em;
        padding-inline: 0;
      }
      .status-line, .meta-line { font-size: 7px; }
      .category, .feed-item, #sync-timer { font-size: 14px; }
      .bottom-panel {
        min-height: 146px;
        gap: 10px;
        padding-top: 10px;
      }
      .bottom-left {
        gap: 8px;
      }
      .qr-callout {
        gap: 8px;
        max-width: 64vw;
      }
      .qr-callout img {
        width: 128px;
        height: 128px;
      }
      .qr-copy {
        min-height: 128px;
      }
      .qr-copy .line-1 { font-size: 8px; margin-bottom: 5px; }
      .qr-copy .line-2 { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="screen-noise" aria-hidden="true"></div>
  <div class="page">
    <div class="top-panel">
      <section class="frame">
        <div class="hero">
          <div class="hero-rule"></div>
          <pre class="ascii-title" data-glow="---### GLOBAL DIGITAL NETWORK ###---">---### GLOBAL DIGITAL NETWORK ###---</pre>
          <div class="hero-rule"></div>
          <div class="corp-tag">============ A WEYLAND-YUTANI COMPANY ============</div>
        </div>
      </section>

      <main id="status-output" class="status"></main>
    </div>

    <section class="feed-shell">
      <div id="feed-output" class="feed-scroll"></div>
    </section>

    <section class="bottom-panel" aria-label="Mobile access and sync status">
      <div class="bottom-left">
        <div class="qr-callout" aria-label="Global Digital Network mobile access">
          <img src="./GREEN_SCREEN_QR.png" alt="QR code linking to Global Digital Network Mobile">
          <div class="qr-copy">
            <div class="line-1">JOIN US ON YOUR OWN DEVICE</div>
            <div class="line-2">GLOBAL DIGITAL NETWORK MOBILE</div>
          </div>
        </div>
      </div>
      <div class="bottom-right">
        <div id="sync-timer">NEXT_SYNC: 04:00</div>
      </div>
      <span class="cursor" aria-hidden="true"></span>
    </section>
  </div>

  <script>
    (() => {
      const REFRESH_SECONDS = 240;
      const FEED_JSON_URL = './feeds.json';
      const MAX_ITEMS = 10;
      const TYPE_DELAY = 20;
      const LINE_DELAY = 185;
      const STARTUP_LINE_DELAY = 650;
      const timerEl = document.getElementById('sync-timer');
      const statusOutput = document.getElementById('status-output');
      const feedOutput = document.getElementById('feed-output');
      let timeLeft = REFRESH_SECONDS;

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `NEXT_SYNC: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function autoScrollFeeds() {
        feedOutput.scrollTo({
          top: feedOutput.scrollHeight,
          behavior: 'smooth'
        });
      }

      async function typeText(el, text, delay = TYPE_DELAY) {
        el.textContent = '';
        for (const ch of text) {
          el.textContent += ch;
          await sleep(delay);
        }
      }

      async function typeLine(text, className = 'status-line') {
        const el = document.createElement('div');
        el.className = className;
        feedOutput.appendChild(el);
        autoScrollFeeds();
        await typeText(el, text);
        autoScrollFeeds();
        await sleep(LINE_DELAY);
        return el;
      }

      async function revealLine(text, className = 'startup-line', delay = STARTUP_LINE_DELAY) {
        const el = document.createElement('div');
        el.className = className;
        statusOutput.appendChild(el);
        el.textContent = text;
        await sleep(delay);
        return el;
      }

      async function typeCategory(text) {
        const el = document.createElement('div');
        el.className = 'category';
        feedOutput.appendChild(el);
        autoScrollFeeds();
        await typeText(el, text);
        autoScrollFeeds();
        await sleep(LINE_DELAY);
        return el;
      }

      async function typeFeedItem(item) {
        const row = document.createElement('div');
        row.className = 'feed-item';
        const a = document.createElement('a');
        a.href = item.link || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        row.appendChild(a);
        feedOutput.appendChild(row);
        autoScrollFeeds();
        await typeText(a, '+ ' + (item.title || 'UNTITLED REPORT'));
        autoScrollFeeds();
        await sleep(118);
        return row;
      }

      function normalize(data) {
        if (!data || !Array.isArray(data.categories)) {
          throw new Error('INVALID_FEEDS_JSON');
        }
        return data;
      }

      async function render(data) {
        statusOutput.innerHTML = '';
        feedOutput.innerHTML = '';
        await revealLine('...INITIALIZING PROTOCOL 5150/1984', 'status-line startup-line');
        await revealLine('...ESTABLISHING SECURE COMM-LINK', 'status-line startup-line');
        await revealLine('...UPLINK TARGET: ICE STATION ZEBRA', 'status-line startup-line');
        const onlineEl = await revealLine('...STATUS: ONLINE', 'status-line startup-line');
        onlineEl.style.animation = 'blink .34s steps(1) infinite';
        if (data.generated_at) {
          await revealLine('...LAST_SYNC: ' + data.generated_at.replace('T', ' ').replace('Z', ' UTC'), 'meta-line startup-meta');
        }
        for (const section of data.categories) {
          await typeCategory(`[SEC: ${section.name}]`);
          const items = Array.isArray(section.items) ? section.items.slice(0, MAX_ITEMS) : [];
          if (!items.length) {
            await typeLine('> [NO_TRANSMISSIONS_RECEIVED]', 'feed-item');
            continue;
          }
          for (const item of items) {
            await typeFeedItem(item);
          }
        }
        const monitorEl = await revealLine('[SYSTEM STATUS: MONITORING ACTIVE]', 'meta-line startup-meta');
        monitorEl.style.animation = 'blink .34s steps(1) infinite';
      }

      async function fail(err) {
        statusOutput.innerHTML = '';
        feedOutput.innerHTML = '';
        await revealLine('...INITIALIZING PROTOCOL 5150/1984', 'status-line startup-line');
        await revealLine('...ESTABLISHING SECURE COMM-LINK', 'status-line startup-line');
        await revealLine('...UPLINK TARGET: ICE STATION ZEBRA', 'status-line startup-line');
        await revealLine('...STATUS: SIGNAL LOSS', 'status-line startup-line');
        await revealLine('...ERROR: ' + String(err && err.message ? err.message : err), 'meta-line startup-meta');
      }

      async function loadFeeds() {
        const response = await fetch(FEED_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = normalize(await response.json());
        await render(data);
      }

      updateTimer();
      setInterval(() => {
        timeLeft -= 1;
        if (timeLeft < 0) {
          window.location.reload();
          return;
        }
        updateTimer();
      }, 1000);

      loadFeeds().catch(fail);
    })();
  </script>
</body>
</html>
