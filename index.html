<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBAL DIGITAL NETWORK</title>
  <style>
    :root {
      --bg: #020602;
      --bg-deep: #010301;
      --green: #37ff63;
      --green-soft: rgba(55,255,99,.36);
      --green-mid: rgba(55,255,99,.82);
      --green-strong: rgba(55,255,99,1);
      --green-dim: #0e4d18;
      --panel: rgba(0, 18, 0, 0.30);
      --line: rgba(90, 255, 135, 0.10);
    }

    * { box-sizing: border-box; font-family: inherit; }
    html, body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    @font-face {
      font-family: "PrintChar21";
      src: url("./PrintChar21.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(88px, calc(72px + env(safe-area-inset-bottom)))
        max(12px, env(safe-area-inset-left));
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      color: var(--green);
      font-family: "PrintChar21", "Courier New", Courier, monospace;
      text-transform: uppercase;
      background:
        radial-gradient(circle at 50% 45%, rgba(32,100,40,.16) 0%, rgba(8,28,10,.07) 28%, rgba(1,6,1,0) 58%),
        radial-gradient(circle at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.32) 92%),
        linear-gradient(to bottom, #031003 0%, var(--bg) 48%, var(--bg-deep) 100%);
      text-shadow:
        0 0 3px rgba(55,255,99,1),
        0 0 12px rgba(55,255,99,.95),
        0 0 26px rgba(55,255,99,.60),
        0 0 42px rgba(55,255,99,.30);
      overflow: hidden;
      position: relative;
      animation: crt-flicker 9s infinite steps(1);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(110,255,150,.11) 0px,
          rgba(110,255,150,.11) 1px,
          rgba(0,0,0,.24) 1px,
          rgba(0,0,0,.24) 3px,
          rgba(14,55,18,.14) 3px,
          rgba(14,55,18,.14) 5px,
          transparent 5px,
          transparent 7px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025) 0px,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 2px
        ),
        linear-gradient(to right, rgba(0,0,0,.14), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.14));
      mix-blend-mode: screen;
      opacity: 1;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(0,0,0,0) 56%, rgba(0,0,0,.18) 78%, rgba(0,0,0,.45) 100%),
        linear-gradient(to bottom, rgba(85,255,130,.05), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 82%, rgba(0,0,0,.16));
      mix-blend-mode: multiply;
    }

    .screen-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .04;
      z-index: 1;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.5) .35px, transparent .75px),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,.38) .35px, transparent .75px),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,.44) .35px, transparent .75px);
      background-size: 13px 13px, 17px 17px, 19px 19px;
      animation: noise-jitter .25s infinite steps(2);
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 100%;
      height: calc(100vh - 104px);
      height: calc(100svh - 104px);
      height: calc(100dvh - 104px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .frame {
      width: 100%;
      max-width: 100%;
      border: 2px solid var(--green);
      background: linear-gradient(to bottom, rgba(0,18,0,.22), rgba(0,12,0,.34));
      box-shadow:
        inset 0 0 34px rgba(55,255,99,.24),
        0 0 20px rgba(55,255,99,.42),
        0 0 40px rgba(55,255,99,.20);
      padding: 10px 14px 9px;
      min-height: 0;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(80,255,130,.12) 0 1px, rgba(0,0,0,.12) 1px 3px, rgba(16,60,20,.12) 3px 5px, transparent 5px 7px);
      opacity: .78;
    }

    .hero {
      width: min(100%, 1600px);
      max-width: 100%;
      margin: 0 auto;
      padding: 2px 0 0;
      text-align: center;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hero-rule { display: none; }

    .ascii-title {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      text-align: center;
      font-size: clamp(18px, 3.25vw, 35px);
      line-height: 1.02;
      letter-spacing: .045em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      color: rgba(55,255,99,.98);
      text-shadow:
        0 0 4px rgba(55,255,99,.98),
        0 0 14px rgba(55,255,99,.78),
        0 0 28px rgba(55,255,99,.32);
      filter: none;
      position: relative;
      border: none;
      background: none;
      box-shadow: none;
    }

    .ascii-title::before { content: none; }

    .corp-tag {
      position: relative;
      display: block;
      width: 100%;
      min-height: 30px;
      margin-top: 0;
      padding: 5px 10px 4px;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      font-weight: 700;
      letter-spacing: .04em;
      font-size: clamp(9px, 1.15vw, 12px);
      line-height: 1.05;
      text-align: center;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
      white-space: nowrap;
      min-height: 0;
      overflow: hidden;
      text-overflow: clip;
    }

    .corp-tag-static,
    .corp-tag-marquee {
      min-height: 20px;
      display: flex;
      align-items: center;
    }

    .corp-tag-static {
      width: 100%;
      justify-content: center;
    }

    .corp-tag-marquee {
      position: absolute;
      inset: 0;
      justify-content: flex-start;
      overflow: hidden;
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: auto;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .corp-tag.scrolling .corp-tag-static {
      opacity: 0;
    }

    .corp-tag.scrolling .corp-tag-marquee {
      opacity: 1;
    }

    .corp-tag-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      min-height: 0;
      width: max-content;
      min-width: max-content;
      will-change: transform;
      animation: corp-marquee 47.5s linear infinite;
      -webkit-animation: corp-marquee 47.5s linear infinite;
      padding-left: 0;
      transform: translate3d(0,0,0);
      -webkit-transform: translate3d(0,0,0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .corp-tag-segment {
      display: flex;
      align-items: center;
      white-space: nowrap;
      min-height: 0;
      flex: 0 0 auto;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .corp-tag-item {
      display: flex;
      align-items: center;
      padding-right: 3.2rem;
      color: inherit;
      text-decoration: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .corp-tag-item:hover {
      text-decoration: underline;
    }

    .corp-tag-label {
      opacity: .82;
      margin-right: .55rem;
    }

    .corp-tag-value {
      font-weight: 700;
    }

    .corp-tag-meta {
      opacity: .72;
      margin-left: .55rem;
      font-size: .75em;
      line-height: 1;
      white-space: nowrap;
      min-height: 0;
    }

    .corp-tag-sep {
      display: inline-block;
      padding-right: 3.2rem;
      opacity: .9;
    }

    .top-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      width: 100%;
      max-width: 100%;
    }

    .status {
      width: min(100%, 1600px);
      max-width: 100%;
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      min-height: 12px;
    }

    .status-line, .meta-line {
      margin: 6px 0;
      font-size: 8px;
      line-height: 1.18;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 14px rgba(55,255,99,.74),
        0 0 28px rgba(55,255,99,.30);
      text-align: right;
    }

    .meta-line { opacity: .95; }

    .startup-line, .startup-meta {
      opacity: .40;
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
    }

    .startup-meta { opacity: .34; }

    .feed-shell {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 100%;
      border-top: 1px solid rgba(55,255,99,.18);
      padding-top: 10px;
    }

    .feed-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 6px;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(55,255,99,.5) rgba(0,0,0,.18);
    }

    .feed-scroll::-webkit-scrollbar {
      width: 10px;
    }

    .feed-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,.18);
    }

    .feed-scroll::-webkit-scrollbar-thumb {
      background: rgba(55,255,99,.45);
      box-shadow: 0 0 10px rgba(55,255,99,.25);
    }

    .category {
      display: inline-block;
      margin-top: 30px;
      margin-bottom: 10px;
      border: 1px solid var(--green);
      padding: 5px 10px;
      background: rgba(0,40,0,.35);
      font-size: 12px;
      box-shadow: inset 0 0 10px rgba(55,255,99,.10), 0 0 12px rgba(55,255,99,.18);
    }

    .feed-item {
      margin: 14px 0;
      padding-left: 10px;
      border-left: 2px solid var(--green);
      font-size: 11px;
      line-height: 1.3;
      word-break: break-word;
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 16px rgba(55,255,99,.68),
        0 0 30px rgba(55,255,99,.28);
    }

    .feed-item a {
      color: inherit;
      text-decoration: none;
    }

    .feed-item a:hover { text-decoration: underline; }

    .headline-time {
      display: inline;
      margin-left: 10px;
      font-size: 8px;
      line-height: 1.18;
      opacity: .34;
      color: var(--green);
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
      white-space: nowrap;
      min-height: 0;
    }

.next-up {
      margin: 22px 0 10px;
      padding-left: 10px;
      border-left: 2px solid rgba(55,255,99,.45);
      font-size: 8px;
      line-height: 1.18;
      opacity: .40;
      color: var(--green);
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
      white-space: nowrap;
      min-height: 0;
      animation: blink .34s steps(1) infinite;
    }


    .feed-scroll.radar-mode {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-right: 0;
      padding-bottom: 0;
      height: 100%;
    }

    .feed-scroll.radar-mode > * {
      flex: 0 0 auto;
    }

    .feed-scroll.radar-mode .category,
    .feed-scroll.radar-mode .next-up {
      flex: 0 0 auto;
    }

    .radar-section {
      margin: 0 0 4px;
      border: 2px solid rgba(55,255,99,.55);
      background:
        linear-gradient(to bottom, rgba(0,16,0,.28), rgba(0,8,0,.42));
      box-shadow:
        inset 0 0 20px rgba(55,255,99,.14),
        0 0 12px rgba(55,255,99,.14);
      width: 100%;
      overflow: hidden;
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .radar-titlebar {
      position: relative;
      z-index: 3;
      display: block;
      width: 100%;
      padding: 5px 10px;
      border-bottom: 1px solid rgba(55,255,99,.30);
      background: rgba(0,40,0,.35);
      font-size: 12px;
      box-shadow: inset 0 0 10px rgba(55,255,99,.10), 0 0 12px rgba(55,255,99,.18);
      color: var(--green);
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 16px rgba(55,255,99,.68),
        0 0 30px rgba(55,255,99,.28);
    }

    .radar-section::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(110,255,150,.10) 0px,
          rgba(110,255,150,.10) 1px,
          rgba(0,0,0,.20) 1px,
          rgba(0,0,0,.20) 3px,
          transparent 3px,
          transparent 6px
        );
      mix-blend-mode: screen;
      opacity: .8;
      z-index: 2;
    }

    .radar-header,
    .radar-footer {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px 5px;
      font-size: 8px;
      line-height: 1.18;
      opacity: .40;
      color: var(--green);
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
      white-space: nowrap;
      min-height: 0;
    }

    .radar-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #000;
      overflow: hidden;
      border-top: 1px solid rgba(55,255,99,.22);
      border-bottom: 1px solid rgba(55,255,99,.22);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      aspect-ratio: 1.58 / 1;
    }

    .radar-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: var(--green);
      overflow: hidden;
    }

    .radar-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.12)),
        radial-gradient(circle at center, rgba(255,255,255,.05), rgba(0,0,0,0) 65%);
      mix-blend-mode: multiply;
      opacity: .45;
      z-index: 2;
    }

    .radar-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
      display: block;
      image-rendering: auto;
      filter:
        grayscale(1)
        contrast(2.35)
        brightness(.68);
      opacity: 1;
      mix-blend-mode: multiply;
      transform: translateZ(0) scale(1.08);
      -webkit-transform: translateZ(0) scale(1.08);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .radar-placeholder {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      font-size: 10px;
      line-height: 1.35;
      color: var(--green);
      background: rgba(0, 0, 0, .72);
      text-shadow:
        0 0 2px rgba(55,255,99,1),
        0 0 10px rgba(55,255,99,.55);
    }

    .radar-placeholder a {
      color: inherit;
    }

    .radar-error .radar-image {
      opacity: .22;
    }

    .radar-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(55,255,99,.07), rgba(55,255,99,.07)) center/1px 100% no-repeat,
        linear-gradient(rgba(55,255,99,.07), rgba(55,255,99,.07)) center/100% 1px no-repeat,
        radial-gradient(circle at center, rgba(55,255,99,.07) 0 1px, transparent 1px 100%);
      mix-blend-mode: screen;
      opacity: .22;
      z-index: 2;
    }

    .radar-ring {
      position: absolute;
      inset: 10% 10%;
      border: 1px solid rgba(55,255,99,.10);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .radar-ring.r2 { inset: 24% 24%; }
    .radar-ring.r3 { inset: 38% 38%; }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.05em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink .85s steps(1) infinite;
      box-shadow: 0 0 14px rgba(55,255,99,.62);
      margin-left: 2px;
    }

    #sync-timer {
      position: fixed;
      right: max(18px, calc(env(safe-area-inset-right) + 8px));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 8px));
      max-width: calc(100vw - 44px - env(safe-area-inset-left) - env(safe-area-inset-right));
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      z-index: 5;
      box-shadow: 0 0 20px rgba(55,255,99,.56), inset 0 0 12px rgba(255,255,255,.10);
      animation: purge-pulse 3.6s ease-in-out infinite;
    }

    .topic-nav-shell {
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 100%;
      border-top: 1px solid rgba(55,255,99,.18);
      padding-top: 8px;
      min-height: 0;
    }

    .topic-nav {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 2px 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(55,255,99,.42) rgba(0,0,0,.16);
      -webkit-overflow-scrolling: touch;
    }

    .topic-nav::-webkit-scrollbar {
      height: 8px;
    }

    .topic-nav::-webkit-scrollbar-track {
      background: rgba(0,0,0,.16);
    }

    .topic-nav::-webkit-scrollbar-thumb {
      background: rgba(55,255,99,.42);
      box-shadow: 0 0 8px rgba(55,255,99,.22);
    }

    .topic-chip {
      flex: 0 0 auto;
      border: 1px solid rgba(55,255,99,.44);
      background:
        linear-gradient(to bottom, rgba(0,34,0,.44), rgba(0,14,0,.52));
      color: var(--green);
      padding: 7px 12px 6px;
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow:
        inset 0 0 10px rgba(55,255,99,.08),
        0 0 10px rgba(55,255,99,.10);
      text-shadow:
        0 0 2px rgba(55,255,99,.92),
        0 0 10px rgba(55,255,99,.42);
      white-space: nowrap;
      transition: background .15s ease, box-shadow .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .topic-chip:hover {
      border-color: rgba(55,255,99,.72);
      box-shadow:
        inset 0 0 12px rgba(55,255,99,.14),
        0 0 14px rgba(55,255,99,.18);
      transform: translateY(-1px);
    }

    .topic-chip[aria-current="true"] {
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.14) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
        rgba(55,255,99,.98);
      color: #061006;
      border-color: rgba(55,255,99,.98);
      box-shadow:
        0 0 18px rgba(55,255,99,.44),
        inset 0 0 10px rgba(255,255,255,.10);
      text-shadow: none;
    }

    .topic-chip:focus-visible {
      outline: 1px solid rgba(55,255,99,.98);
      outline-offset: 2px;
    }

    .topic-chip-wrap {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      min-width: max-content;
    }

    .topic-chip-edit {
      align-self: flex-end;
      border: 0;
      background: none;
      color: var(--green);
      padding: 0;
      font-size: 8px;
      line-height: 1.18;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: pointer;
      box-shadow: none;
      text-shadow:
        0 0 1px rgba(55,255,99,.45),
        0 0 5px rgba(55,255,99,.22),
        0 0 10px rgba(55,255,99,.10);
      filter: brightness(.78);
      white-space: nowrap;
      transition: opacity .15s ease, transform .15s ease;
    }

    .topic-chip-edit:hover {
      opacity: .75;
      transform: translateY(-1px);
    }

    .topic-chip-edit:focus-visible {
      outline: 1px solid rgba(55,255,99,.98);
      outline-offset: 2px;
    }

    .radar-map-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      filter:
        grayscale(1)
        contrast(2.35)
        brightness(.68);
      opacity: 1;
      mix-blend-mode: multiply;
      transform: translateZ(0) scale(1.08);
      -webkit-transform: translateZ(0) scale(1.08);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes noise-jitter {
      0% { transform: translate(0,0); }
      25% { transform: translate(.3px,-.4px); }
      50% { transform: translate(-.2px,.2px); }
      75% { transform: translate(.4px,.1px); }
      100% { transform: translate(0,0); }
    }

    @keyframes crt-flicker {
      0%, 19%, 21%, 63%, 65%, 100% { opacity: 1; }
      20% { opacity: .992; }
      64% { opacity: .996; }
    }

    @keyframes corp-marquee {
      0% { transform: translate3d(0,0,0); }
      100% { transform: translate3d(-50%,0,0); }
    }

    @-webkit-keyframes corp-marquee {
      0% { -webkit-transform: translate3d(0,0,0); }
      100% { -webkit-transform: translate3d(-50%,0,0); }
    }

    @keyframes purge-pulse {
      0%, 100% {
        background:
          repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,.14) 1px 3px, rgba(16,58,20,.14) 3px 5px),
          rgba(55,255,99,.88);
        box-shadow: 0 0 14px rgba(55,255,99,.42), inset 0 0 10px rgba(255,255,255,.08);
      }
      50% {
        background:
          repeating-linear-gradient(to bottom, rgba(255,255,255,.12) 0 1px, rgba(0,0,0,.18) 1px 3px, rgba(16,58,20,.18) 3px 5px),
          rgba(35,180,70,.72);
        box-shadow: 0 0 8px rgba(55,255,99,.22), inset 0 0 6px rgba(255,255,255,.05);
      }
    }

    @media (max-width: 900px) {
      body {
        padding-top: max(10px, env(safe-area-inset-top));
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(18px, env(safe-area-inset-right));
        padding-bottom: max(92px, calc(76px + env(safe-area-inset-bottom)));
      }
      .page {
        height: calc(100vh - 110px);
        height: calc(100svh - 110px);
        height: calc(100dvh - 110px);
      }
      .frame { padding: 8px 10px 7px; min-height: 0; }
      .hero { gap: 6px; }
      .corp-tag {
        min-height: 24px;
        font-size: clamp(7px, 2.2vw, 11px);
        padding-inline: 6px;
      }
      .corp-tag-track {
        animation-duration: 40s;
        -webkit-animation-duration: 40s;
      }
      .ascii-title {
        font-size: clamp(12px, 4.8vw, 22px);
        letter-spacing: .03em;
        padding-inline: 0;
      }
      .status-line, .meta-line { font-size: 7px; }
      .headline-time { font-size: 7px; }
      .next-up { font-size: 7px; }
      .category, .feed-item { font-size: 14px; }
      .radar-header, .radar-footer {
        font-size: 7px;
        white-space: normal;
      }
      .radar-viewport {
        aspect-ratio: 1.5 / 1;
      }
      .radar-image {
        object-position: center 60%;
        transform: translateZ(0) scale(1.03);
        -webkit-transform: translateZ(0) scale(1.03);
      }
      .topic-nav {
        gap: 6px;
        padding-top: 2px;
      }
      .topic-chip {
        font-size: 9px;
        padding: 6px 10px 5px;
      }
      .topic-chip-edit {
        font-size: 7px;
        padding: 0;
      }
      #sync-timer { font-size: 12px; max-width: calc(100vw - 36px); }
    }
  </style>
</head>
<body>
  <div class="screen-noise" aria-hidden="true"></div>
  <div class="page">
    <div id="sync-timer">PURGE_CYCLE: 04:00</div>

    <div class="top-panel">
      <section class="frame">
        <div class="hero">
          <div class="hero-rule"></div>
          <pre class="ascii-title" data-glow="/// GLOBAL DIGITAL NETWORK ///">/// GLOBAL DIGITAL NETWORK ///</pre>
          <div class="hero-rule"></div>
          <div class="corp-tag" id="corp-tag">
            <div class="corp-tag-static" id="corp-tag-static">GDN OPERATIONAL COMPLIANCE TERMINAL  ///   ACHERON_OS_REVISION: v2084.42</div>
            <div class="corp-tag-marquee" id="corp-tag-marquee" aria-hidden="false">
              <div class="corp-tag-track" id="corp-tag-track"></div>
            </div>
          </div>
        </div>
      </section>

      <main id="status-output" class="status"></main>
    </div>

    <section class="feed-shell">
      <div id="feed-output" class="feed-scroll"></div>
    </section>

    <section class="topic-nav-shell" aria-label="News feed navigation">
      <div id="topic-nav" class="topic-nav" role="tablist" aria-label="Feed topics"></div>
    </section>
  </div>

  <script>
    (() => {
      const REFRESH_SECONDS = 90;
      const FEED_JSON_URL = './feeds.json';
      const MAX_ITEMS = 13;
      const TYPE_DELAY = 20;
      const LINE_DELAY = 185;
      const STARTUP_LINE_DELAY = 1400;
      const STATUS_CYCLE_DELAY = 2000;
      const timerEl = document.getElementById('sync-timer');
      const statusOutput = document.getElementById('status-output');
      const feedOutput = document.getElementById('feed-output');
      const corpTag = document.getElementById('corp-tag');
      const corpTagTrack = document.getElementById('corp-tag-track');
      const topicNav = document.getElementById('topic-nav');

      const CORP_BAR_URL = './corpbar.json';
      const DEFAULT_TICKERS = [
        { symbol: 'AAPL', price: 'N/A', link: 'https://www.nasdaq.com/market-activity/stocks/aapl', source: 'Nasdaq' },
        { symbol: 'COMP', price: 'N/A', link: 'https://www.nasdaq.com/market-activity/index/comp', source: 'Nasdaq' },
        { symbol: 'AMZN', price: 'N/A', link: 'https://www.nasdaq.com/market-activity/stocks/amzn', source: 'Nasdaq' },
        { symbol: 'GOOGL', price: 'N/A', link: 'https://www.nasdaq.com/market-activity/stocks/googl', source: 'Nasdaq' },
        { symbol: 'META', price: 'N/A', link: 'https://www.nasdaq.com/market-activity/stocks/meta', source: 'Nasdaq' }
      ];
      const DEFAULT_US_HOLIDAY = { name: 'US HOLIDAY DATA LINK OFFLINE', region: 'US', date: '', link: '#', source: 'LOCAL FALLBACK' };
      const DEFAULT_WORLD_OBSERVANCE = { name: 'WORLD OBSERVANCE DATA LINK OFFLINE', region: 'WORLD', date: '', link: '#', source: 'LOCAL FALLBACK' };
      const RADAR_SECTION_NAME = 'LOCAL WEATHER MAP';
      const RADAR_INSERT_AFTER = null;
      const WEATHER_ZIP_STORAGE_KEY = 'gdnWeatherZip';
      const DEFAULT_WEATHER_ZIP = '15222';
      const DEFAULT_WEATHER_CENTER = { lat: 40.4406, lon: -79.9959, label: 'PITTSBURGH PA' };
      const RADAR_FALLBACK_URL = 'https://www.windy.com/';
      let weatherZip = loadWeatherZip();
      let weatherCenter = { ...DEFAULT_WEATHER_CENTER };
      let timeLeft = REFRESH_SECONDS;
      const TIMER_STEP_MS = 10;
      let activeCursor = null;
      let statusCycleInterval = null;
      let sectionsState = [];
      let currentSectionIndex = 0;
      let transitionInProgress = false;
      let cycleInterval = null;
      let loadCurrentSection = async () => {};

      function sanitizeWeatherZip(value) {
        return String(value ?? '').replace(/\D/g, '').slice(0, 5);
      }

      function loadWeatherZip() {
        try {
          const stored = window.localStorage.getItem(WEATHER_ZIP_STORAGE_KEY);
          const clean = sanitizeWeatherZip(stored);
          return clean || DEFAULT_WEATHER_ZIP;
        } catch (err) {
          return DEFAULT_WEATHER_ZIP;
        }
      }

      function saveWeatherZip(zip) {
        const clean = sanitizeWeatherZip(zip) || DEFAULT_WEATHER_ZIP;
        weatherZip = clean;
        try {
          window.localStorage.setItem(WEATHER_ZIP_STORAGE_KEY, clean);
        } catch (err) {
        }
        return clean;
      }

      async function resolveWeatherCenter(zip) {
        const clean = sanitizeWeatherZip(zip) || DEFAULT_WEATHER_ZIP;
        try {
          const response = await fetch(`https://api.zippopotam.us/us/${clean}`, { cache: 'no-store' });
          if (!response.ok) throw new Error('ZIP_LOOKUP_FAILED');
          const data = await response.json();
          const place = Array.isArray(data.places) && data.places[0] ? data.places[0] : null;
          const lat = place ? Number(place.latitude) : NaN;
          const lon = place ? Number(place.longitude) : NaN;
          const placeName = place && place['place name'] ? String(place['place name']).toUpperCase() : '';
          const stateName = place && place['state abbreviation'] ? String(place['state abbreviation']).toUpperCase() : '';
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('ZIP_COORDS_INVALID');
          weatherCenter = {
            lat,
            lon,
            label: [placeName, stateName].filter(Boolean).join(' ').trim() || DEFAULT_WEATHER_CENTER.label
          };
          return weatherCenter;
        } catch (err) {
          weatherCenter = { ...DEFAULT_WEATHER_CENTER };
          return weatherCenter;
        }
      }

      function buildWeatherEmbedUrl() {
        const lat = Number.isFinite(weatherCenter.lat) ? weatherCenter.lat : DEFAULT_WEATHER_CENTER.lat;
        const lon = Number.isFinite(weatherCenter.lon) ? weatherCenter.lon : DEFAULT_WEATHER_CENTER.lon;
        return `https://embed.windy.com/embed2.html?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&detailLat=${encodeURIComponent(lat)}&detailLon=${encodeURIComponent(lon)}&width=650&height=450&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=true&marker=true&calendar=now&pressure=true&type=map&location=coordinates`;
      }

      function getSectionNavLabel(section) {
        if (section && section.isRadar) {
          return `${RADAR_SECTION_NAME} ZIP ${weatherZip}`;
        }
        return section && section.name ? section.name : `SECTION`;
      }

      function normalizeCorpBar(data) {
        if (!data || typeof data !== 'object') return null;
        return {
          as_of: data.as_of || '',
          tickers: Array.isArray(data.tickers) ? data.tickers : [],
          us_holiday: data.us_holiday && typeof data.us_holiday === 'object' ? data.us_holiday : null,
          world_observance: data.world_observance && typeof data.world_observance === 'object' ? data.world_observance : null
        };
      }

      function esc(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatCorpTimestamp(value) {
        if (!value) return '';
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return String(value);
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const yy = String(d.getFullYear()).slice(-2);
          const hh = String(((d.getHours() + 11) % 12) + 1);
          const min = String(d.getMinutes()).padStart(2, '0');
          const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
          return `${mm}/${dd}/${yy} ${hh}:${min} ${ampm}`;
        } catch (e) {
          return String(value);
        }
      }

      function formatTickerItem(ticker) {
        const symbol = ticker.symbol || 'UNKNOWN';
        const price = (ticker.price !== undefined && ticker.price !== null && ticker.price !== '') ? String(ticker.price) : 'N/A';
        const change = ticker.change_percent ? ` ${ticker.change_percent}` : '';
        const stamp = ticker.as_of ? ` ${formatCorpTimestamp(ticker.as_of)}` : '';
        const href = ticker.link || '#';
        const source = ticker.source ? ` ${ticker.source}` : '';
        return `<a class="corp-tag-item" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="corp-tag-value">${esc(symbol)} ${esc(price)}${esc(change)}</span><span class="corp-tag-meta">${esc(stamp + source)}</span></a>`;
      }

      function formatHolidayItem(label, payload, fallbackPayload) {
        const item = payload || fallbackPayload;
        const href = item.link || '#';
        const region = item.region ? ` ${item.region}` : '';
        const stamp = item.date ? ` ${formatCorpTimestamp(item.date + 'T12:00:00')}` : '';
        const source = item.source ? ` ${item.source}` : '';
        return `<a class="corp-tag-item" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><span class="corp-tag-label">${esc(label)}</span><span class="corp-tag-value">${esc(item.name)}${esc(region)}</span><span class="corp-tag-meta">${esc(stamp + source)}</span></a>`;
      }

      function buildCorpTickerItems(data) {
        const tickers = (data && data.tickers && data.tickers.length) ? data.tickers : DEFAULT_TICKERS;
        const tickerItems = tickers.map(formatTickerItem);
        const usHolidayItem = formatHolidayItem('US HOLIDAY', data && data.us_holiday, DEFAULT_US_HOLIDAY);
        const worldObservanceItem = formatHolidayItem('WORLD OBSERVANCE', data && data.world_observance, DEFAULT_WORLD_OBSERVANCE);
        return [...tickerItems, usHolidayItem, worldObservanceItem];
      }

      async function loadCorpBarData() {
        try {
          const response = await fetch(CORP_BAR_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return normalizeCorpBar(await response.json());
        } catch (err) {
          return null;
        }
      }

      async function initCorpTicker() {
        if (!corpTag || !corpTagTrack) return;
        const data = await loadCorpBarData();
        const items = buildCorpTickerItems(data);
        const segmentHtml = items.map((item) => `${item}<span class="corp-tag-sep">///</span>`).join('');
        corpTagTrack.innerHTML =
          `<span class="corp-tag-segment">${segmentHtml}</span>` +
          `<span class="corp-tag-segment">${segmentHtml}</span>`;

        // Safari/iOS repaint nudge for marquee stability
        corpTagTrack.style.animation = 'none';
        corpTagTrack.style.webkitAnimation = 'none';
        void corpTagTrack.offsetWidth;
        corpTagTrack.style.animation = 'corp-marquee 47.5s linear infinite';
        corpTagTrack.style.webkitAnimation = 'corp-marquee 47.5s linear infinite';

        corpTag.classList.remove('scrolling');
        setTimeout(() => corpTag.classList.add('scrolling'), 5000);
      }

      function updateTimer() {
        const totalHundredths = Math.max(0, Math.ceil(timeLeft * 100));
        const minutes = Math.floor(totalHundredths / 6000);
        const seconds = Math.floor((totalHundredths % 6000) / 100);
        const fractionalPrimary = Math.floor((totalHundredths % 100) / 10);
        const fractionalSecondary = totalHundredths % 10;
        timerEl.textContent = `PURGE_CYCLE: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(fractionalPrimary).padStart(2, '0')}:${String(fractionalSecondary).padStart(2, '0')}`;
      }

      function buildTopicNav(sectionList) {
        if (!topicNav) return;
        topicNav.innerHTML = '';
        sectionList.forEach((section, index) => {
          const wrap = document.createElement('div');
          wrap.className = 'topic-chip-wrap';

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'topic-chip';
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', 'false');
          button.setAttribute('aria-current', 'false');
          button.dataset.index = String(index);
          button.textContent = getSectionNavLabel(section);
          wrap.appendChild(button);

          if (section && section.isRadar) {
            const editButton = document.createElement('button');
            editButton.type = 'button';
            editButton.className = 'topic-chip-edit';
            editButton.dataset.action = 'edit-weather-zip';
            editButton.dataset.index = String(index);
            editButton.textContent = 'EDIT ZIP';
            wrap.appendChild(editButton);
          }

          topicNav.appendChild(wrap);
        });
      }

      function updateTopicNav() {
        if (!topicNav) return;
        const buttons = topicNav.querySelectorAll('.topic-chip');
        buttons.forEach((button, index) => {
          const isActive = index === currentSectionIndex;
          button.setAttribute('aria-selected', isActive ? 'true' : 'false');
          button.setAttribute('aria-current', isActive ? 'true' : 'false');
        });

        const activeButton = topicNav.querySelector(`.topic-chip[data-index="${currentSectionIndex}"]`);
        if (activeButton && typeof activeButton.scrollIntoView === 'function') {
          activeButton.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }

      async function jumpToSection(index) {
        if (transitionInProgress) return;
        if (!Array.isArray(sectionsState) || !sectionsState.length) return;
        if (Number.isNaN(index) || index < 0 || index >= sectionsState.length) return;

        currentSectionIndex = index;
        await loadCurrentSection();
      }

      if (topicNav) {
        topicNav.addEventListener('click', async (event) => {
          const editButton = event.target.closest('.topic-chip-edit');
          if (editButton) {
            const entered = window.prompt('ENTER 5-DIGIT U.S. ZIP CODE FOR LOCAL WEATHER MAP', weatherZip);
            if (entered === null) return;
            const clean = sanitizeWeatherZip(entered);
            if (clean.length !== 5) {
              window.alert('PLEASE ENTER A VALID 5-DIGIT U.S. ZIP CODE.');
              return;
            }
            saveWeatherZip(clean);
            await resolveWeatherCenter(clean);
            buildTopicNav(sectionsState);
            updateTopicNav();
            if (sectionsState[currentSectionIndex] && sectionsState[currentSectionIndex].isRadar) {
              await loadCurrentSection();
            }
            return;
          }

          const button = event.target.closest('.topic-chip');
          if (!button) return;
          const index = Number(button.dataset.index);
          await jumpToSection(index);
        });
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function autoScrollFeeds() {
        feedOutput.scrollTo({
          top: feedOutput.scrollHeight,
          behavior: 'smooth'
        });
      }

      function makeCursor() {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        cursor.setAttribute('aria-hidden', 'true');
        return cursor;
      }

      function moveCursorTo(el) {
        if (!activeCursor) activeCursor = makeCursor();
        if (activeCursor.parentNode) {
          activeCursor.parentNode.removeChild(activeCursor);
        }
        el.appendChild(activeCursor);
      }

      function removeCursor() {
        if (activeCursor && activeCursor.parentNode) {
          activeCursor.parentNode.removeChild(activeCursor);
        }
      }

      async function typeText(el, text, delay = TYPE_DELAY) {
        el.innerHTML = '';
        const textNode = document.createTextNode('');
        el.appendChild(textNode);
        moveCursorTo(el);
        for (const ch of text) {
          textNode.nodeValue += ch;
          autoScrollFeeds();
          await sleep(delay);
        }
        removeCursor();
      }

      async function typeLine(text, className = 'status-line') {
        const el = document.createElement('div');
        el.className = className;
        feedOutput.appendChild(el);
        autoScrollFeeds();
        await typeText(el, text);
        autoScrollFeeds();
        await sleep(LINE_DELAY);
        return el;
      }

      async function typeCategory(text) {
        const el = document.createElement('div');
        el.className = 'category';
        feedOutput.appendChild(el);
        autoScrollFeeds();
        await typeText(el, text);
        autoScrollFeeds();
        await sleep(LINE_DELAY);
        return el;
      }

      function formatHeadlineTimestamp(value) {
        if (!value) return '';
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return '';
          const yyyy = d.getUTCFullYear();
          const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(d.getUTCDate()).padStart(2, '0');
          const hh = String(d.getUTCHours()).padStart(2, '0');
          const min = String(d.getUTCMinutes()).padStart(2, '0');
          return ` [${yyyy}-${mm}-${dd} ${hh}:${min} UTC]`;
        } catch (e) {
          return '';
        }
      }

      async function typeFeedItem(item) {
        const row = document.createElement('div');
        row.className = 'feed-item';

        const a = document.createElement('a');
        a.href = item.link || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        row.appendChild(a);

        feedOutput.appendChild(row);
        autoScrollFeeds();

        await typeText(a, '+ ' + (item.title || 'UNTITLED REPORT'));

        const stamp = formatHeadlineTimestamp(item.published_at);
        if (stamp) {
          const time = document.createElement('span');
          time.className = 'headline-time';
          time.textContent = stamp;
          row.appendChild(time);
        }

        autoScrollFeeds();
        await sleep(118);
        return row;
      }

      async function typeNextUp(text) {
        const el = document.createElement('div');
        el.className = 'next-up';
        feedOutput.appendChild(el);
        autoScrollFeeds();
        await typeText(el, text);
        autoScrollFeeds();
        await sleep(LINE_DELAY);
        return el;
      }

      function buildSectionSequence(data) {
        const sections = Array.isArray(data.categories) ? [...data.categories] : [];
        const radarSection = { name: RADAR_SECTION_NAME, isRadar: true, items: [] };
        const insertAfterIndex = sections.findIndex(
          s => String((s && s.name) || '').toUpperCase() === RADAR_INSERT_AFTER
        );
          if (insertAfterIndex >= 0) {
          sections.splice(insertAfterIndex + 1, 0, radarSection);
        } else {
          sections.unshift(radarSection);
        }
        return sections;
      }

      function formatDisplayTimestamp(dateObj = new Date()) {
        const yyyy = dateObj.getUTCFullYear();
        const mm = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getUTCDate()).padStart(2, '0');
        const hh = String(dateObj.getUTCHours()).padStart(2, '0');
        const min = String(dateObj.getUTCMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} ${hh}:${min} UTC`;
      }

      async function renderRadarSection(nextSectionName) {
        removeCursor();
        feedOutput.classList.add('radar-mode');
        feedOutput.innerHTML = '';

        await resolveWeatherCenter(weatherZip);

        const wrapper = document.createElement('div');
        wrapper.className = 'radar-section';
        wrapper.innerHTML = `
          <div class="radar-titlebar">[SEC: LOCAL WEATHER MAP / ZIP ${esc(weatherZip)}]</div>
          <div class="radar-header">
            <span>RADAR CENTER / ZIP ${esc(weatherZip)}</span>
            <span>REGION: ${esc(weatherCenter.label)}</span>
          </div>
          <div class="radar-viewport">
            <div class="radar-stage">
              <iframe
                class="radar-map-frame"
                title="Live animated weather radar map"
                loading="eager"
                referrerpolicy="no-referrer-when-downgrade"
                src="${esc(buildWeatherEmbedUrl())}">
              </iframe>
              <div class="radar-grid"></div>
              <div class="radar-ring"></div>
              <div class="radar-ring r2"></div>
              <div class="radar-ring r3"></div>
            </div>
          </div>
          <div class="radar-footer">
            <span>LIVE PRECIPITATION / ZIP ${esc(weatherZip)}</span>
            <span>UPLINK: ${formatDisplayTimestamp()}</span>
          </div>
        `;
        feedOutput.appendChild(wrapper);

        const stage = wrapper.querySelector('.radar-stage');
        const radarFrame = wrapper.querySelector('.radar-map-frame');

        const showRadarError = (message) => {
          if (wrapper.querySelector('.radar-placeholder')) return;
          wrapper.classList.add('radar-error');
          const placeholder = document.createElement('div');
          placeholder.className = 'radar-placeholder';
          placeholder.innerHTML = `${esc(message)}<br><br><a href="${esc(RADAR_FALLBACK_URL)}" target="_blank" rel="noopener noreferrer">OPEN WEATHER MAP</a>`;
          stage.appendChild(placeholder);
        };

        radarFrame.addEventListener('load', () => {
          wrapper.classList.remove('radar-error');
          const placeholder = wrapper.querySelector('.radar-placeholder');
          if (placeholder) placeholder.remove();
        }, { once: true });

        radarFrame.addEventListener('error', () => {
          showRadarError('WEATHER MAP FAILED TO LOAD.');
        }, { once: true });

        autoScrollFeeds();
        await sleep(LINE_DELAY);

        if (nextSectionName) {
          await typeNextUp(`.....BUFFERING INCOMING DATA SEQUENCE: ${nextSectionName}`);
        } else {
          await typeNextUp('.....BUFFERING INCOMING DATA SEQUENCE: SYSTEM RELOAD / RETURN TO FIRST SECTION');
        }
      }

      function normalize(data) {
        if (!data || !Array.isArray(data.categories)) {
          throw new Error('INVALID_FEEDS_JSON');
        }
        return data;
      }

      function startStatusCycle(data) {
        if (statusCycleInterval) clearInterval(statusCycleInterval);

        const lines = [
          { text: '...INITIALIZING PROTOCOL 5150/1984', className: 'status-line startup-line' },
          { text: '...ESTABLISHING SECURE COMM-LINK', className: 'status-line startup-line' },
          { text: '...UPLINK TARGET: ICE STATION ZEBRA', className: 'status-line startup-line' },
          { text: '...STATUS: ONLINE', className: 'status-line startup-line', blink: true },
          {
            text: '...LAST_SYNC: ' + (
              data.generated_at
                ? data.generated_at.replace('T', ' ').replace('Z', ' UTC')
                : 'UNKNOWN'
            ),
            className: 'meta-line startup-meta'
          }
        ];

        const holder = document.createElement('div');
        statusOutput.innerHTML = '';
        statusOutput.appendChild(holder);

        let i = 0;
        const showLine = () => {
          const line = lines[i];
          holder.className = line.className;
          holder.textContent = line.text;
          holder.style.animation = line.blink ? 'blink .34s steps(1) infinite' : 'none';
          i = (i + 1) % lines.length;
        };

        showLine();
        statusCycleInterval = setInterval(showLine, STATUS_CYCLE_DELAY);
      }

      async function renderSection(section, nextSectionName) {
        removeCursor();
        feedOutput.classList.remove('radar-mode');
        feedOutput.innerHTML = '';

        await typeCategory(`[SEC: ${section.name}]`);
        const items = Array.isArray(section.items) ? section.items.slice(0, MAX_ITEMS) : [];
        if (!items.length) {
          await typeLine('> [NO_TRANSMISSIONS_RECEIVED]', 'feed-item');
        } else {
          for (const item of items) {
            await typeFeedItem(item);
          }
        }

        if (nextSectionName) {
          await typeNextUp(`.....BUFFERING INCOMING DATA SEQUENCE: ${nextSectionName}`);
        } else {
          await typeNextUp('.....BUFFERING INCOMING DATA SEQUENCE: SYSTEM RELOAD / RETURN TO FIRST SECTION');
        }
      }

      async function runSections(data) {
        startStatusCycle(data);

        if (cycleInterval) {
          clearInterval(cycleInterval);
          cycleInterval = null;
        }

        sectionsState = buildSectionSequence(data);
        if (!sectionsState.length) {
          feedOutput.innerHTML = '';
          await typeLine('> [NO_TRANSMISSIONS_RECEIVED]', 'feed-item');
          return;
        }

        currentSectionIndex = 0;
        await resolveWeatherCenter(weatherZip);
        buildTopicNav(sectionsState);

        loadCurrentSection = async () => {
          transitionInProgress = true;
          updateTopicNav();

          const nextName = currentSectionIndex < sectionsState.length - 1
            ? sectionsState[currentSectionIndex + 1].name
            : null;

          if (sectionsState[currentSectionIndex] && sectionsState[currentSectionIndex].isRadar) {
            await renderRadarSection(nextName);
          } else {
            await renderSection(sectionsState[currentSectionIndex], nextName);
          }

          timeLeft = REFRESH_SECONDS;
          updateTimer();
          updateTopicNav();
          transitionInProgress = false;
        };

        await sleep(STARTUP_LINE_DELAY);
        await loadCurrentSection();

        cycleInterval = setInterval(async () => {
          if (transitionInProgress) return;

          timeLeft -= TIMER_STEP_MS / 1000;
          if (timeLeft <= 0) {
            transitionInProgress = true;

            if (currentSectionIndex >= sectionsState.length - 1) {
              clearInterval(cycleInterval);
              window.location.reload();
              return;
            }

            currentSectionIndex += 1;
            await loadCurrentSection();
            return;
          }

          updateTimer();
        }, TIMER_STEP_MS);
      }

      async function fail(err) {
        if (statusCycleInterval) clearInterval(statusCycleInterval);
        removeCursor();
        statusOutput.innerHTML = '';
        feedOutput.innerHTML = '';
        const el = document.createElement('div');
        el.className = 'meta-line startup-meta';
        el.textContent = '...ERROR: ' + String(err && err.message ? err.message : err);
        statusOutput.appendChild(el);
      }

      async function loadFeeds() {
        const response = await fetch(FEED_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = normalize(await response.json());
        await runSections(data);
      }

      updateTimer();

      initCorpTicker();
      loadFeeds().catch(fail);
    })();
  </script>
</body>
</html>
