<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="240">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBAL NEWS NETWORK</title>
  <style>
    :root {
      --bg: #040904;
      --green: #22ff44;
      --green-dim: #0f5f1e;
      --panel: rgba(0, 22, 0, 0.32);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 16px 16px 72px;
      background:
        radial-gradient(circle at center, rgba(0,40,0,.18), transparent 45%),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
        var(--bg);
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(34,255,68,.85), 0 0 12px rgba(34,255,68,.28);
      overflow-x: hidden;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.06), rgba(0,0,0,0), rgba(0,0,0,.08));
      mix-blend-mode: multiply;
    }
    .frame {
      border: 2px solid var(--green);
      background: var(--panel);
      padding: 22px 20px 20px;
      margin-bottom: 26px;
      min-height: 320px;
    }
    .hero {
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
    }
    .hero-rule {
      height: 2px;
      width: 64%;
      margin: 8px auto;
      background: linear-gradient(to right, transparent, var(--green), transparent);
      box-shadow: 0 0 10px rgba(34,255,68,.45);
    }
    .hero-title {
      margin: 10px 0 0;
      line-height: .92;
      letter-spacing: .08em;
      font-weight: 700;
      text-align: center;
    }
    .hero-title .line {
      display: block;
      font-size: clamp(54px, 8.6vw, 94px);
      text-align: center;
      white-space: nowrap;
    }
    .hero-title .line.small {
      font-size: clamp(48px, 7.2vw, 82px);
      margin-top: .06em;
    }
    .hero-title .outlined {
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(34,255,68,.95);
      text-shadow:
        0 0 6px rgba(34,255,68,.55),
        0 0 18px rgba(34,255,68,.2);
    }
    .corp-tag {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 22px;
      background: var(--green);
      color: #031103;
      font-weight: 700;
      letter-spacing: .04em;
      box-shadow: 0 0 10px rgba(34,255,68,.35);
    }
    .status, .category, .feed-item {
      max-width: 1600px;
    }
    .status-line, .meta-line {
      margin: 8px 0;
      font-size: clamp(16px, 1.55vw, 24px);
      line-height: 1.22;
    }
    .meta-line { opacity: .95; }
    .category {
      display: inline-block;
      margin-top: 30px;
      margin-bottom: 10px;
      border: 1px solid var(--green);
      padding: 5px 10px;
      background: rgba(0,40,0,.35);
      font-size: clamp(16px, 1.45vw, 24px);
    }
    .feed-item {
      margin: 14px 0;
      padding-left: 10px;
      border-left: 2px solid var(--green);
      font-size: clamp(17px, 1.52vw, 26px);
      line-height: 1.3;
      word-break: break-word;
    }
    .feed-item a {
      color: inherit;
      text-decoration: none;
    }
    .feed-item a:hover { text-decoration: underline; }
    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.15em;
      background: var(--green);
      vertical-align: bottom;
      animation: blink .85s steps(1) infinite;
      box-shadow: 0 0 10px rgba(34,255,68,.5);
    }
    #sync-timer {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: var(--green);
      color: #061006;
      padding: 8px 14px;
      font-size: clamp(18px, 1.45vw, 24px);
      font-weight: 700;
      z-index: 5;
      box-shadow: 0 0 10px rgba(34,255,68,.35);
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 700px) {
      body { padding-inline: 10px; }
      .frame { padding-inline: 10px; min-height: 250px; }
      .corp-tag { font-size: 12px; padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div id="sync-timer">NEXT_SYNC: 04:00</div>

  <section class="frame">
    <div class="hero">
      <div class="hero-rule"></div>
      <div class="hero-title outlined">
        <span class="line">GLOBAL NEWS</span>
        <span class="line small">NETWORK</span>
      </div>
      <div class="hero-rule"></div>
      <div class="corp-tag">============ A WEYLAND-YUTANI PARTNER ============</div>
    </div>
  </section>

  <main id="output" class="status"></main>
  <span class="cursor" aria-hidden="true"></span>

  <script>
    (() => {
      const REFRESH_SECONDS = 240;
      const FEED_JSON_URL = './feeds.json';
      const MAX_ITEMS = 5;
      const timerEl = document.getElementById('sync-timer');
      const output = document.getElementById('output');
      let timeLeft = REFRESH_SECONDS;

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `NEXT_SYNC: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function line(text, className = 'status-line') {
        const el = document.createElement('div');
        el.className = className;
        el.textContent = text;
        output.appendChild(el);
        return el;
      }

      function category(text) {
        const el = document.createElement('div');
        el.className = 'category';
        el.textContent = text;
        output.appendChild(el);
        return el;
      }

      function feedItem(item) {
        const row = document.createElement('div');
        row.className = 'feed-item';
        const a = document.createElement('a');
        a.href = item.link || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '+ ' + (item.title || 'UNTITLED REPORT');
        row.appendChild(a);
        output.appendChild(row);
      }

      function normalize(data) {
        if (!data || !Array.isArray(data.categories)) {
          throw new Error('INVALID_FEEDS_JSON');
        }
        return data;
      }

      function render(data) {
        output.innerHTML = '';
        line('> [LOADER_v6.2] INITIALIZING...');
        line('> ESTABLISHING SECURE COMM-LINK...');
        line('> LINK TARGET: LOCAL FEED CACHE');
        line('> STATUS: ONLINE');
        if (data.generated_at) {
          line('> LAST_SYNC: ' + data.generated_at.replace('T', ' ').replace('Z', ' UTC'), 'meta-line');
        }
        for (const section of data.categories) {
          category(`[SEC: ${section.name}]`);
          const items = Array.isArray(section.items) ? section.items.slice(0, MAX_ITEMS) : [];
          if (!items.length) {
            line('> [NO_TRANSMISSIONS_RECEIVED]', 'feed-item');
            continue;
          }
          for (const item of items) feedItem(item);
        }
        line('[SYSTEM STATUS: MONITORING ACTIVE]');
      }

      function fail(err) {
        output.innerHTML = '';
        line('> [LOADER_v6.2] INITIALIZING...');
        line('> ESTABLISHING SECURE COMM-LINK...');
        line('> [SIGNAL LOSS] FEED CACHE UNAVAILABLE');
        line('> ERROR: ' + String(err && err.message ? err.message : err), 'meta-line');
      }

      async function loadFeeds() {
        const response = await fetch(FEED_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = normalize(await response.json());
        render(data);
      }

      updateTimer();
      setInterval(() => {
        timeLeft -= 1;
        if (timeLeft < 0) {
          window.location.reload();
          return;
        }
        updateTimer();
      }, 1000);

      loadFeeds().catch(fail);
    })();
  </script>
</body>
</html>
