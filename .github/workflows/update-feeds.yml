name: Update feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build feeds.json from RSS
        shell: bash
        run: |
          python <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          FEEDS = [
              (
                  'WORLD',
                  'https://news.google.com/rss/search?q=' + urllib.parse.quote('world news') + '&hl=en-US&gl=US&ceid=US:en'
              ),
              (
                  'TECH',
                  'https://news.google.com/rss/search?q=' + urllib.parse.quote('technology news') + '&hl=en-US&gl=US&ceid=US:en'
              ),
              (
                  'US_NEWS',
                  'https://news.google.com/rss/search?q=' + urllib.parse.quote('united states news') + '&hl=en-US&gl=US&ceid=US:en'
              )
          ]

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (compatible; NewsPageBot/1.0; +https://github.com/)'
          }

          def clean_google_link(link: str) -> str:
              if not link:
                  return '#'
              parsed = urllib.parse.urlparse(link)
              query = urllib.parse.parse_qs(parsed.query)
              if 'url' in query and query['url']:
                  return query['url'][0]
              return link

          def parse_items(xml_bytes: bytes):
              root = ET.fromstring(xml_bytes)
              items = root.findall('./channel/item')
              results = []
              for item in items[:8]:
                  title = (item.findtext('title') or '').strip()
                  link = clean_google_link((item.findtext('link') or '').strip())
                  pub_date = (item.findtext('pubDate') or '').strip()
                  iso_date = ''
                  if pub_date:
                      try:
                          iso_date = parsedate_to_datetime(pub_date).astimezone(timezone.utc).isoformat().replace('+00:00', 'Z')
                      except Exception:
                          iso_date = ''
                  if title:
                      results.append({
                          'title': title,
                          'link': link,
                          'published_at': iso_date
                      })
              return results

          categories = []
          for name, url in FEEDS:
              try:
                  request = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      xml_bytes = response.read()
                  items = parse_items(xml_bytes)
                  if not items:
                      items = [{'title': 'NO HEADLINES RETURNED', 'link': '#', 'published_at': ''}]
              except Exception as exc:
                  items = [{'title': f'SIGNAL LOSS: {exc}', 'link': '#', 'published_at': ''}]
              categories.append({'name': name, 'items': items})

          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'categories': categories
          }

          with open('feeds.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2, ensure_ascii=False)
              fh.write('\n')
          PY

      - name: Commit updated feeds.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update feeds.json"
          git push
