name: Update corp bar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,11,13,15,17 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: corpbar-update
  cancel-in-progress: false

jobs:
  update-corp-bar:
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build corpbar.json
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime
          from html import unescape
          from zoneinfo import ZoneInfo
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          EASTERN = ZoneInfo("America/New_York")
          now_et = datetime.now(EASTERN)

          # 5 symbols x 5 runs/day = 25 requests/day (fits Alpha Vantage free daily cap)
          TICKERS = [
              ("AAPL", "https://www.nasdaq.com/market-activity/stocks/aapl", "Nasdaq"),
              ("COMP", "https://www.nasdaq.com/market-activity/index/comp", "Nasdaq"),
              ("AMZN", "https://www.nasdaq.com/market-activity/stocks/amzn", "Nasdaq"),
              ("GOOGL", "https://www.nasdaq.com/market-activity/stocks/googl", "Nasdaq"),
              ("META", "https://www.nasdaq.com/market-activity/stocks/meta", "Nasdaq"),
          ]

          WORLD_HOLIDAY_COUNTRIES = [
              ("GB", "United Kingdom"),
              ("CA", "Canada"),
              ("AU", "Australia"),
              ("JP", "Japan"),
              ("DE", "Germany"),
          ]

          CHECKIDAY_BASE = "https://www.checkiday.com"

          def get_text(url, headers=None):
              req = Request(url, headers=headers or {"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", errors="replace")

          def get_json(url, headers=None):
              return json.loads(get_text(url, headers=headers))

          def nager_holidays(country_code, year):
              url = f"https://date.nager.at/api/v3/PublicHolidays/{year}/{country_code}"
              try:
                  return get_json(url)
              except Exception:
                  return []

          def todays_major_us_holiday(now_dt):
              target_date = now_dt.strftime("%Y-%m-%d")
              holidays = nager_holidays("US", now_dt.year)
              today_items = [h for h in holidays if h.get("date") == target_date]
              if today_items:
                  picked = today_items[0]
                  return {
                      "name": picked.get("localName") or picked.get("name") or "US Holiday",
                      "region": "US",
                      "date": picked.get("date", ""),
                      "link": "https://date.nager.at/",
                      "source": "Nager.Date"
                  }
              return None

          def todays_world_major_holiday(now_dt):
              target_date = now_dt.strftime("%Y-%m-%d")
              for code, region_name in WORLD_HOLIDAY_COUNTRIES:
                  holidays = nager_holidays(code, now_dt.year)
                  today_items = [h for h in holidays if h.get("date") == target_date]
                  if today_items:
                      picked = today_items[0]
                      return {
                          "name": picked.get("localName") or picked.get("name") or "World Holiday",
                          "region": region_name,
                          "date": target_date,
                          "link": "https://date.nager.at/",
                          "source": "Nager.Date"
                      }
              return None

          def strip_tags(value):
              value = re.sub(r"<[^>]+>", "", value)
              value = unescape(value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def fetch_checkiday_items(now_dt):
              url = f"{CHECKIDAY_BASE}/{now_dt.month}/{now_dt.day}/{now_dt.year}"
              try:
                  html = get_text(url, headers={"User-Agent": "Mozilla/5.0"})
              except Exception:
                  return []

              # Extract H2-linked holiday titles before the "On This Day in History" section.
              pattern = re.compile(
                  r"<h2[^>]*>\s*<a[^>]+href=[\"\'](?P<href>[^\"\']+)[\"\'][^>]*>(?P<title>.*?)</a>\s*</h2>",
                  re.IGNORECASE | re.DOTALL
              )

              items = []
              for match in pattern.finditer(html):
                  title = strip_tags(match.group("title"))
                  href = urljoin(CHECKIDAY_BASE, match.group("href"))
                  if not title or title.lower() == "on this day in history":
                      continue
                  items.append({
                      "name": title,
                      "link": href,
                      "source": "Checkiday",
                      "date": now_dt.strftime("%Y-%m-%d"),
                  })

              # Deduplicate while preserving order
              seen = set()
              unique = []
              for item in items:
                  key = (item["name"], item["link"])
                  if key in seen:
                      continue
                  seen.add(key)
                  unique.append(item)
              return unique

          def pick_checkiday_us_observance(items, now_dt):
              # Prefer clearly US/national items; otherwise take the first valid daily listing item.
              preferred = []
              secondary = []
              for item in items:
                  name = item["name"].lower()
                  if any(token in name for token in ["national ", "american ", "u.s.", "us ", " usa "]):
                      preferred.append(item)
                  elif any(token in name for token in ["international ", "world ", "global ", "united nations"]):
                      secondary.append(item)

              picked = preferred[0] if preferred else (items[0] if items else None)
              if not picked:
                  return {
                      "name": "Daily Observance",
                      "region": "US",
                      "date": now_dt.strftime("%Y-%m-%d"),
                      "link": CHECKIDAY_BASE,
                      "source": "Static Fallback"
                  }

              return {
                  "name": picked["name"],
                  "region": "US",
                  "date": picked["date"],
                  "link": picked["link"],
                  "source": picked["source"]
              }

          def pick_checkiday_world_observance(items, now_dt):
              # Prefer international/world/global observances; otherwise fall back to the first item.
              preferred = []
              for item in items:
                  name = item["name"].lower()
                  if any(token in name for token in ["international ", "world ", "global ", "united nations"]):
                      preferred.append(item)

              picked = preferred[0] if preferred else (items[0] if items else None)
              if not picked:
                  return {
                      "name": "Daily World Observance",
                      "region": "WORLD",
                      "date": now_dt.strftime("%Y-%m-%d"),
                      "link": CHECKIDAY_BASE,
                      "source": "Static Fallback"
                  }

              return {
                  "name": picked["name"],
                  "region": "WORLD",
                  "date": picked["date"],
                  "link": picked["link"],
                  "source": picked["source"]
              }

          def fetch_quote(symbol):
              api_key = os.environ.get("ALPHA_VANTAGE_API_KEY", "").strip()
              if not api_key:
                  return {
                      "symbol": symbol,
                      "price": "N/A",
                      "change_percent": "",
                      "as_of": "NO API KEY",
                  }

              params = urlencode({
                  "function": "GLOBAL_QUOTE",
                  "symbol": symbol,
                  "apikey": api_key,
              })
              data = get_json("https://www.alphavantage.co/query?" + params)
              quote = data.get("Global Quote", {})

              if not quote:
                  note = data.get("Note") or data.get("Information") or "NO DATA"
                  return {
                      "symbol": symbol,
                      "price": "N/A",
                      "change_percent": "",
                      "as_of": note[:80],
                  }

              latest_day = quote.get("07. latest trading day", "")
              latest_stamp = latest_day + " ET" if latest_day else now_et.strftime("%Y-%m-%d %H:%M ET")

              return {
                  "symbol": symbol,
                  "price": quote.get("05. price", "N/A"),
                  "change_percent": quote.get("10. change percent", ""),
                  "as_of": latest_stamp,
              }

          today_items = fetch_checkiday_items(now_et)

          us_holiday = todays_major_us_holiday(now_et)
          if not us_holiday:
              us_holiday = pick_checkiday_us_observance(today_items, now_et)

          world_observance = todays_world_major_holiday(now_et)
          if not world_observance:
              world_observance = pick_checkiday_world_observance(today_items, now_et)

          payload = {
              "as_of": now_et.isoformat(),
              "tickers": [],
              "us_holiday": us_holiday,
              "world_observance": world_observance,
          }

          # Spread requests to reduce per-minute throttling on Alpha Vantage free tier
          for idx, (symbol, link, source) in enumerate(TICKERS):
              quote = fetch_quote(symbol)
              quote["link"] = link
              quote["source"] = source
              payload["tickers"].append(quote)
              if idx < len(TICKERS) - 1:
                  time.sleep(15)

          with open("corpbar.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

      - name: Commit updated corpbar.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpbar.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update corpbar.json"
          git push
